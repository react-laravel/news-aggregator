name: News hosted CI and B deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested main revision to B
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: news-b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/never_connect
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest discover -s tests -v
      - run: npm run build
      - run: node scripts/package-news.mjs "$GITHUB_SHA"
      - run: python3 scripts/archive-news.py "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.sha }}
          path: news-runtime.tar.gz
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    environment: news-b
    concurrency:
      group: news-b-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: news-${{ github.sha }}
      - name: Publish only this News runtime
        env:
          NEWS_B_SSH_KEY: ${{ secrets.NEWS_B_SSH_KEY }}
          NEWS_B_KNOWN_HOSTS: ${{ secrets.NEWS_B_KNOWN_HOSTS }}
        run: bash scripts/deploy-news-to-b.sh
