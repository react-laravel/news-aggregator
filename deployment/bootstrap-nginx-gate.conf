# Insert verbatim inside only dogeow-test-news-https.conf's server block.
# The root-owned file exists only for the one-time old-code takeover.
# Local publisher readiness checks continue while public ingress is paused.
set $news_bootstrap_gate "";
if (-f /var/lib/dogeow-news-lock/bootstrap-maintenance) {
    set $news_bootstrap_gate "closed";
}
if ($remote_addr = 127.0.0.1) {
    set $news_bootstrap_gate "";
}
if ($news_bootstrap_gate = "closed") { return 503; }
